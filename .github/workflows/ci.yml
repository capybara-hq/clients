name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels its older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No default token permissions: each job asks for what it needs.
permissions: {}

# Branch protection requires `ci-ok` (which aggregates every job below) and `issue-linked`
# (set by community.yml, not part of this workflow). The repository is small: everything runs on
# every PR and every push to main, with no diff-based planning.
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:i18n

  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # The desktop app against a fake deployment (apps/desktop/e2e). Electron's postinstall stays off
  # for the install above (the unit-test jobs stay fast); `pnpm e2e` fetches the binary itself.
  e2e:
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e
      # The app writes no logs of its own under the seam; the traces and error context are what a
      # macOS-only failure leaves.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() || cancelled()
        with:
          name: e2e-failure
          retention-days: 7
          path: apps/desktop/e2e/test-results
          if-no-files-found: ignore

  # The mobile app's native suites (apps/mobile): XCTest and XCUITest on an iPhone simulator.
  # scripts/ios-test.sh keeps the runner's Xcode unless it has no usable iPhone simulator.
  mobile-ios:
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Swift package checkouts (Capacitor) under the script's derived data path.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/mobile/ios/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('apps/mobile/ios/**/Package.resolved') }}
      # One build-for-testing, then test-without-building for AppTests and AppUITests.
      - run: pnpm --filter @capybara-hq/mobile test:ios:all

  # JVM unit tests, then the instrumented tests on an emulator (KVM on the Linux runner).
  mobile-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @capybara-hq/mobile test:android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: pnpm --filter @capybara-hq/mobile test:android:device

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint commit messages
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  # Aggregate: the only required check. Every job must succeed; commitlint is skipped (and so
  # passes) outside pull requests. always(): report failure when an upstream job failed or was
  # cancelled instead of being skipped (skipped = passed).
  ci-ok:
    if: always()
    needs: [lint, typecheck, test, e2e, mobile-ios, mobile-android, commitlint]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          TEST: ${{ needs.test.result }}
          E2E: ${{ needs.e2e.result }}
          MOBILE_IOS: ${{ needs.mobile-ios.result }}
          MOBILE_ANDROID: ${{ needs.mobile-android.result }}
          COMMITLINT: ${{ needs.commitlint.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "lint=$LINT typecheck=$TYPECHECK test=$TEST e2e=$E2E commitlint=$COMMITLINT"
          echo "mobile-ios=$MOBILE_IOS mobile-android=$MOBILE_ANDROID"
          fail=0
          [ "$LINT" = "success" ] || fail=1
          [ "$TYPECHECK" = "success" ] || fail=1
          [ "$TEST" = "success" ] || fail=1
          [ "$E2E" = "success" ] || fail=1
          [ "$MOBILE_IOS" = "success" ] || fail=1
          [ "$MOBILE_ANDROID" = "success" ] || fail=1
          if [ "$EVENT" = "pull_request" ]; then
            [ "$COMMITLINT" = "success" ] || fail=1
          else
            case "$COMMITLINT" in success | skipped) ;; *) fail=1 ;; esac
          fi
          exit "$fail"
