name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels its older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No default token permissions: each job asks for what it needs.
permissions: {}

# Branch protection requires `ci-ok` (which aggregates every job below) and `issue-linked`
# (set by community.yml, not part of this workflow). The repository is small: everything runs on
# every PR and every push to main, with no diff-based planning.
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint commit messages
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  # Aggregate: the only required check. Every job must succeed; commitlint is skipped (and so
  # passes) outside pull requests. always(): report failure when an upstream job failed or was
  # cancelled instead of being skipped (skipped = passed).
  ci-ok:
    if: always()
    needs: [lint, typecheck, test, commitlint]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          TEST: ${{ needs.test.result }}
          COMMITLINT: ${{ needs.commitlint.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "lint=$LINT typecheck=$TYPECHECK test=$TEST commitlint=$COMMITLINT"
          fail=0
          [ "$LINT" = "success" ] || fail=1
          [ "$TYPECHECK" = "success" ] || fail=1
          [ "$TEST" = "success" ] || fail=1
          if [ "$EVENT" = "pull_request" ]; then
            [ "$COMMITLINT" = "success" ] || fail=1
          else
            case "$COMMITLINT" in success | skipped) ;; *) fail=1 ;; esac
          fi
          exit "$fail"
