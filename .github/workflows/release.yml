name: Release

# Manual only: a maintainer runs it (M2 secrets, M4 acceptance). Never on pull requests or pushes.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to GitHub Releases (needs the signing secrets); off builds and uploads artifacts only
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-latest
    # contents: write is needed only to publish the release assets.
    permissions:
      contents: ${{ inputs.publish && 'write' || 'read' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Require the main branch or a tag when publishing
        if: ${{ inputs.publish && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "::error::Publishing runs only from main or a tag (ref: $GITHUB_REF)."
          exit 1
      - name: Require the signing secrets when publishing
        if: ${{ inputs.publish }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Cannot publish: missing repository secrets:$missing. Set them (M2) or run with publish off."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # The pinned universal Node and the exact device package (verified downloads, no secrets);
      # `dist` runs it again from its cache, and afterPack fails the build if either is wrong.
      - run: pnpm --filter @capybara-hq/desktop bundle-node
      # Secrets are visible to this step only (install and test run without them).
      - name: Build (signed and notarized when publishing, otherwise unsigned)
        env:
          PUBLISH: ${{ inputs.publish }}
          CSC_LINK: ${{ inputs.publish && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.publish && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_CONTENT: ${{ inputs.publish && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ inputs.publish && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ inputs.publish && secrets.APPLE_API_ISSUER || '' }}
          APPLE_TEAM_ID: ${{ inputs.publish && secrets.APPLE_TEAM_ID || '' }}
          GH_TOKEN: ${{ inputs.publish && secrets.GITHUB_TOKEN || '' }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            key_file="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_file"
            export APPLE_API_KEY="$key_file"
            pnpm --filter @capybara-hq/desktop dist --mac --publish always
          else
            CSC_IDENTITY_AUTO_DISCOVERY=false pnpm --filter @capybara-hq/desktop dist --mac --publish never
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !inputs.publish }}
        with:
          name: capybara-mac-unsigned
          path: apps/desktop/release/*.dmg
          if-no-files-found: error
