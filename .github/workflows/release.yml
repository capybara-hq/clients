name: Release

# Manual only: a maintainer runs it (M2 secrets, M4 acceptance). Never on pull requests or pushes.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to GitHub Releases (needs the signing secrets); off builds and uploads artifacts only
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-latest
    # contents: write is needed only to publish the release assets.
    permissions:
      contents: ${{ inputs.publish && 'write' || 'read' }}
    timeout-minutes: 60
    env:
      PUBLISH: ${{ inputs.publish }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Require the signing secrets when publishing
        if: ${{ inputs.publish }}
        run: |
          missing=""
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Cannot publish: missing repository secrets:$missing. Set them (M2) or run with publish off."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Write the notarization API key
        if: ${{ inputs.publish }}
        run: |
          key_file="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_file"
          echo "APPLE_API_KEY=$key_file" >> "$GITHUB_ENV"
      - name: Build (signed and notarized when publishing, otherwise unsigned)
        run: |
          if [ "$PUBLISH" = "true" ]; then
            pnpm --filter @capybara-hq/desktop dist --mac --publish always
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID
            pnpm --filter @capybara-hq/desktop dist --mac --publish never
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !inputs.publish }}
        with:
          name: capybara-mac-unsigned
          path: apps/desktop/release/*.dmg
          if-no-files-found: error
