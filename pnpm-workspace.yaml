packages:
  - packages/*
  - apps/*
allowBuilds:
  # Electron's postinstall downloads the binary (~100 MB). Unit tests take Electron objects as
  # parameters and never run it, so installs skip it. Only `pnpm e2e` needs the binary: it runs
  # electron's install script itself (idempotent), so the other jobs stay fast.
  electron: false
  esbuild: true
# Capacitor's CapacitorCookies wipes the default WebView profile's session cookies on every Android
# Activity start and destroy even when disabled; the patch makes that depend on `enabled` (Android
# single-store mode keeps a deployment's session there; apps/mobile DefaultProfileCookiesTest).
patchedDependencies:
  "@capacitor/android@8.6.2": patches/@capacitor__android@8.6.2.patch
