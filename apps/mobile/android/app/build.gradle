apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// applicationId and the URL scheme come from brand.properties (generated from brand.ts).
def brandProperties = new Properties()
file("../brand.properties").withInputStream { brandProperties.load(it) }

// Push channels (core spec §9.2), switched on per brand by apply-brand through brand.properties
// (a Gradle property of the same name can switch a channel on: CI's push leg passes
// -PpushFcm=true -PjpushAppKey=...):
//   pushFcm=true          FCM: Firebase Messaging and Play services, src/fcm (code, manifest with
//                         POST_NOTIFICATIONS) and the google-services plugin (needs
//                         app/google-services.json);
//   jpushAppKey=<appKey>  JPush: the JPush SDK and src/jpush (code, manifest with
//                         POST_NOTIFICATIONS).
// A channel that is off compiles src/fcmOff or src/jpushOff instead (empty stand-ins) and merges
// no manifest, so the official build (neither key) has no push SDK class, no push component and
// no push permission, POST_NOTIFICATIONS included (ruling R20).
def pushFcm = brandProperties.getProperty("pushFcm", "false") == "true" || project.findProperty("pushFcm") == "true"
def jpushAppKey = (project.findProperty("jpushAppKey") ?: brandProperties.getProperty("jpushAppKey", "")).toString().trim()
if (pushFcm) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    // The app's own code lives in com.capybarahq.shell whatever the brand's application id.
    namespace = "com.capybarahq.shell"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId brandProperties.getProperty("applicationId")
        resValue "string", "app_name", brandProperties.getProperty("appName")
        resValue "string", "title_activity_main", brandProperties.getProperty("appName")
        manifestPlaceholders = [
            brandScheme: brandProperties.getProperty("scheme"),
        ]
        if (!jpushAppKey.isEmpty()) {
            // The JPush SDK's own manifest reads these three.
            manifestPlaceholders += [
                JPUSH_PKGNAME: brandProperties.getProperty("applicationId"),
                JPUSH_APPKEY: jpushAppKey,
                JPUSH_CHANNEL: "developer-default",
            ]
        }
        // The only scheme a sign-in callback may use (AuthSession.kt).
        buildConfigField "String", "BRAND_SCHEME", "\"${brandProperties.getProperty("scheme")}\""
        // Which push channels this build carries (PushChannels.kt).
        buildConfigField "boolean", "PUSH_FCM", pushFcm.toString()
        buildConfigField "String", "JPUSH_APPKEY", "\"${jpushAppKey}\""
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // The release workflow passes -PcapybaraVersionCode=<github.run_number>.
        versionCode((project.findProperty("capybaraVersionCode") ?: "1").toInteger())
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
    // The hostile-page test pages (apps/mobile/testpages/hostile) and the loopback sign-in block
    // fixture (apps/mobile/test/fixtures/sign-in-block.json) ship in the test APK's assets.
    sourceSets {
        androidTest.assets.srcDirs += ['../../testpages', '../../test/fixtures']
        // The push channels (see the top): the real one or its empty stand-in, and the real one's
        // JVM tests.
        main.java.srcDirs += [pushFcm ? 'src/fcm/java' : 'src/fcmOff/java']
        main.java.srcDirs += [jpushAppKey.isEmpty() ? 'src/jpushOff/java' : 'src/jpush/java']
        if (pushFcm) test.java.srcDirs += ['src/testFcm/java']
        if (!jpushAppKey.isEmpty()) test.java.srcDirs += ['src/testJpush/java']
    }
    buildFeatures {
        buildConfig = true
    }
    // Release signing comes from CAPYBARA_KEYSTORE_* (set by CI); without them the release build is unsigned.
    signingConfigs {
        release {
            def keystorePath = System.getenv("CAPYBARA_KEYSTORE_PATH")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("CAPYBARA_KEYSTORE_PASSWORD")
                keyAlias System.getenv("CAPYBARA_KEY_ALIAS")
                keyPassword System.getenv("CAPYBARA_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv("CAPYBARA_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // The profile WebViews' gate: document-start script, web message listener, profiles.
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    // The browser sheet (Custom Tabs) for other origins and new windows.
    implementation "androidx.browser:browser:$androidxBrowserVersion"
    // Push SDKs, only for the channels the brand carries (see the top).
    if (pushFcm) {
        implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
        implementation "com.google.android.gms:play-services-base:$playServicesBaseVersion"
    }
    if (!jpushAppKey.isEmpty()) {
        implementation "cn.jiguang.sdk:jpush:$jpushVersion"
        // Pinned: the JPush POM asks for jcore [1.0.0,).
        implementation "cn.jiguang.sdk:jcore:$jcoreVersion"
    }
    testImplementation "junit:junit:$junitVersion"
    // The real org.json for JVM tests that read the shared vector files (android.jar's is a stub).
    testImplementation "org.json:json:20250517"
    testImplementation "org.robolectric:robolectric:$robolectricVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

// Each carried channel's manifest (its service or receiver, SDK settings) merges over main's.
androidComponents {
    onVariants(selector().all()) { variant ->
        if (pushFcm) variant.sources.manifests.addStaticManifestFile("src/fcm/AndroidManifest.xml")
        if (!jpushAppKey.isEmpty()) variant.sources.manifests.addStaticManifestFile("src/jpush/AndroidManifest.xml")
    }
}

apply from: 'capacitor.build.gradle'
