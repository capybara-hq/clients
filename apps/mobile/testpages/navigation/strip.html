<!doctype html>
<!-- Task 31: the strip navigation through nav@1, the way the web (core Task 30) uses it. With
     nav@1 the page marks <html data-native-nav>, sets the four sections (收件箱 with a count) and,
     while it is narrow (compact: the Duo's outer display), the menu button; when wide (the inner
     display) `menu: null`. onSelect moves the location to the section's route without a reload;
     onMenu is reported. Every change (the strip coming or going) re-reads nav@1. -->
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <style>
      html, body { margin: 0; background: #f4f1ea; font: 17px -apple-system, sans-serif; }
      #probe { position: fixed; top: 0; right: 0; width: 0; padding-right: env(safe-area-inset-right); }
      main { padding: 80px 16px; padding-right: calc(16px + env(safe-area-inset-right)); }
    </style>
  </head>
  <body>
    <div id="probe"></div>
    <main>
      <p id="status">waiting</p>
      <p id="path"></p>
    </main>
    <script>
      const routes = { chats: "/", inbox: "/inbox", agents: "/agents", schedules: "/schedules" };
      let seq = 0;
      const report = (doc, results) =>
        fetch("/report", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ doc, results: { ...results, seq: seq++ } }),
        });
      const envRight = () => parseFloat(getComputedStyle(document.getElementById("probe")).paddingRight);
      const shell = window.capybaraShell;
      let stops = [];
      let narrow = null;
      const state = () => ({
        items: [
          { id: "chats", label: "对话" },
          { id: "inbox", label: "收件箱", count: 3 },
          { id: "agents", label: "智能体" },
          { id: "schedules", label: "定时任务" },
        ],
        current: "chats",
        menu: innerWidth < 600 ? { label: "菜单", count: 3 } : null,
      });
      const show = () => {
        const nav = shell?.capabilities?.["nav@1"];
        document.documentElement.toggleAttribute("data-native-nav", !!nav);
        document.getElementById("status").textContent = nav ? "native nav" : "no native nav";
        document.getElementById("path").textContent = location.pathname;
        return nav;
      };
      const attach = (why) => {
        for (const stop of stops) stop();
        stops = [];
        const nav = show();
        narrow = innerWidth < 600;
        if (nav) {
          stops.push(
            nav.onSelect((id) => {
              history.pushState(null, "", routes[id]);
              show();
              report(`strip-select-${id}`, { id, path: location.pathname });
            }),
            nav.onMenu(() => report("strip-menu", {})),
          );
          nav.set(state()).then(
            () => report(`strip-set-${why}`, { ok: true, menu: state().menu }),
            (e) => report(`strip-set-${why}`, { error: String(e) }),
          );
        }
        report(`strip-${why}`, {
          nav: !!nav,
          dataNativeNav: document.documentElement.hasAttribute("data-native-nav"),
          envRight: envRight(),
          width: innerWidth,
        });
      };
      if (!shell) {
        report("strip-ready", { error: "no capybaraShell" });
      } else {
        // env() can read 0 right after load (spike 1.4): wait a frame or two before measuring.
        requestAnimationFrame(() => requestAnimationFrame(() => attach("ready")));
        shell.on("change", () => attach("change"));
        new ResizeObserver(() => {
          if (envRight() > 0) report("strip-env", { envRight: envRight(), width: innerWidth });
        }).observe(document.getElementById("probe"), { box: "border-box" });
        addEventListener("resize", () => {
          if ((innerWidth < 600) === narrow) return;
          attach("resize");
        });
      }
    </script>
  </body>
</html>
