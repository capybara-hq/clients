<!doctype html>
<!-- Task 16 fix round 1 (I3): a form POST to origin B, which Android's shouldOverrideUrlLoading
     never sees. The backstop must stop it and return to the base. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body, form { margin: 0; height: 100%; }
      button { width: 100%; height: 100%; font: 24px system-ui; border: 0; background: #fde; }
    </style>
  </head>
  <body>
    <form method="post" action="__ORIGIN_B__/foreign.html?via=post">
      <input type="hidden" name="x" value="1" />
      <button type="submit">Post to B</button>
    </form>
    <script>
      fetch("/report", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ doc: "post-ready", results: {} }),
      });
    </script>
  </body>
</html>
