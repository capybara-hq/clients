<!doctype html>
<!-- Task 16: the ways a profile page leaves its origin. Each third of the screen is one tap target:
     window.open to origin B (a user gesture), a target=_blank link to origin B, and a same-window
     link to /redirect, which the server answers with a 302 to origin B. Every one must reach the
     browser sheet and none may load origin B in the profile WebView. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body { margin: 0; height: 100%; }
      .t { position: fixed; left: 0; width: 100%; height: 33.3%; display: flex; align-items: center;
           justify-content: center; font: 24px system-ui; color: #000; text-decoration: none; }
      #open { top: 0; background: #fde; border: 0; }
      #blank { top: 33.3%; background: #dfe; }
      #redirect { top: 66.6%; background: #def; }
    </style>
  </head>
  <body>
    <button class="t" id="open" type="button">Open window</button>
    <a class="t" id="blank" target="_blank" href="__ORIGIN_B__/foreign.html?via=blank">Blank link</a>
    <a class="t" id="redirect" href="/redirect">Redirect link</a>
    <script>
      document.getElementById("open").addEventListener("click", () => {
        window.open("__ORIGIN_B__/foreign.html?via=open");
      });
      fetch("/report", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ doc: "nav-ready", results: { origin: self.origin } }),
      });
    </script>
  </body>
</html>
