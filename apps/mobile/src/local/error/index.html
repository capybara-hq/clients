<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"
    />
    <title>Capybara</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf9f6;
        --panel: #ffffff;
        --ink: #1a1a18;
        --muted: #5e5e5a;
        --line: #d9d8d2;
        --accent: #cc4609;
        --on-accent: #ffffff;
        font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --panel: #111110;
          --ink: #e6e6e3;
          --muted: #8e8e89;
          --line: #2a2a28;
          --accent: #ff6a13;
          --on-accent: #0a0a0a;
        }
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
      }
      main {
        box-sizing: border-box;
        max-width: 480px;
        margin: 0 auto;
        padding: calc(env(safe-area-inset-top) + 72px) 24px calc(env(safe-area-inset-bottom) + 24px);
      }
      h1 {
        font-size: 24px;
        line-height: 1.3;
        margin: 0 0 12px;
      }
      h2 {
        font-size: 15px;
        color: var(--muted);
        margin: 24px 0 8px;
      }
      .lead {
        font-size: 17px;
        line-height: 1.5;
        margin: 0;
      }
      .code {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 13px;
        color: var(--muted);
        margin: 12px 0 0;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 32px;
      }
      button {
        font: inherit;
        font-size: 17px;
        min-height: 48px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        padding: 0 20px;
      }
      .primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
      }
      .switcher {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .item {
        text-align: left;
        border-radius: 12px;
      }
      .current {
        border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <script src="error.js"></script>
  </body>
</html>
