<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>连接出错</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF8240}a:hover{color:#FF6A13}
</style>
</helmet>
<div style="width: 480px; height: 600px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; justify-content: center; padding: 0 56px; background: #0A0A0A; color: #E6E6E3; font-family: 'Noto Sans SC', system-ui, sans-serif; overflow: hidden;">
  <div style="position: absolute; left: 0; top: 0; right: 0; height: 44px; display: flex; align-items: center; gap: 8px; padding-left: 16px; box-sizing: border-box;">
    <span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57;"></span>
    <span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E;"></span>
    <span style="width: 12px; height: 12px; border-radius: 50%; background: #3A3A37;"></span>
    <div style="position: absolute; right: 14px; top: 508px; display: flex; align-items: center; gap: 6px;">
      <button type="button" aria-label="语言" style="height: 26px; padding: 0 8px; border: 1px solid #2A2A28; border-radius: 6px; background: transparent; color: #8E8E89; font-family: inherit; font-size: 12px; display: inline-flex; align-items: center; gap: 4px;">中文<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button>
      <div role="group" aria-label="外观" style="display: inline-flex; height: 26px; border: 1px solid #2A2A28; border-radius: 6px; overflow: hidden;">
        <button type="button" aria-label="浅色" style="width: 28px; border: 0; background: transparent; color: #5A5A56; display: inline-flex; align-items: center; justify-content: center;"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/></svg></button>
        <button type="button" aria-label="深色" aria-pressed="true" style="width: 28px; border: 0; background: #1A1A18; color: #E6E6E3; display: inline-flex; align-items: center; justify-content: center;"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M13 9.5A5.5 5.5 0 016.5 3a5.5 5.5 0 106.5 6.5z"/></svg></button>
      </div>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 28px; margin-top: -40px;">
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <h1 style="margin: 0; font-size: 24px; font-weight: 600; line-height: 1.3;">连接到你的平台</h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #8E8E89;">输入组织给你的平台地址。登录会在浏览器里完成。</p>
    </div>
    <form style="display: flex; flex-direction: column; gap: 10px; margin: 0;">
      <label for="addr2" style="font-size: 13px; color: #8E8E89;">平台地址</label>
      <div style="display: flex; align-items: center; height: 44px; border: 1px solid #E5484D; border-radius: 8px; background: #111110; padding: 0 14px; gap: 2px;">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #5A5A56;">{{scheme}}</span>
        <input id="addr2" type="text" value="{{cur.host}}" aria-describedby="err" aria-invalid="true" style="flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; color: #E6E6E3; font-family: 'JetBrains Mono', monospace; font-size: 14px;">
      </div>
      <div id="err" role="alert" style="display: flex; gap: 8px; font-size: 13px; line-height: 1.6; color: #FF8A8E; min-height: 42px;">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" style="flex: none; margin-top: 4px;"><circle cx="8" cy="8" r="6.2"/><path d="M8 4.8v3.6M8 10.8v.4"/></svg>
        <span>{{cur.text}}</span>
      </div>
      <button type="button" style="margin-top: 4px; height: 44px; border: 0; border-radius: 8px; background: #FF6A13; color: #0A0A0A; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">{{cur.action}}</button>
    </form>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;">
    <sc-for list="{{kinds}}" as="k" hint-placeholder-count="5">
      <button type="button" onClick="{{k.pick}}" style="{{k.style}}">{{k.label}}</button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":600}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { i: 0 }; }
  renderVals() {
    const list = [
      { label: '连不上', host: 'capybara.meta1.tpo', text: '连接不上 capybara.meta1.tpo。检查地址是否拼错，或者网络、VPN 是否已连接。', action: '重试' },
      { label: '不是平台', host: 'meta1.top', text: '这个地址不是 Capybara 平台。确认组织给你的地址是否正确。', action: '继续' },
      { label: '版本太旧', host: 'old.example.com', text: '这个平台的版本太旧，还不支持桌面端登录。请联系平台管理员升级。', action: '继续' },
      { label: '非 https', host: '10.0.0.5:3000', text: '只能连接 https 地址（本机 localhost 除外）。', action: '继续' },
      { label: '证书无效', host: 'capybara.corp.local', text: '证书无效，无法安全连接到 capybara.corp.local。请联系平台管理员。', action: '重试' }
    ];
    const i = this.state.i;
    const base = 'height: 24px; padding: 0 8px; border-radius: 6px; font-family: inherit; font-size: 11px; cursor: pointer; ';
    return {
      cur: list[i],
      scheme: i === 3 ? 'http://' : 'https://',
      kinds: list.map((k, j) => ({
        label: k.label,
        pick: () => this.setState({ i: j }),
        style: base + (j === i ? 'border: 1px solid #3A3A37; background: #1A1A18; color: #E6E6E3;' : 'border: 1px solid #1C1C1A; background: transparent; color: #5A5A56;')
      }))
    };
  }
}
</script>
</body>
</html>
